spring.application.name=DistribuidoraAmaral

# Configuración SOLO para las pruebas automáticas (mvn test):
# se usa una base H2 en memoria en modo MySQL, así las pruebas no
# dependen de MySQL ni modifican la base real "amaral".
spring.datasource.url=jdbc:h2:mem:amaral_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Las tablas se crean con schema-h2.sql (copia de docs/amaral.sql) y
# Hibernate valida que todas las entidades coincidan con esas tablas
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-h2.sql
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

spring.thymeleaf.cache=false
