<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formulario de usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1 th:text="${usuario.idUsuario == null
        ? 'Registrar usuario' : 'Editar usuario'}"></h1>

    <form th:object="${usuario}" method="post"
          th:action="${usuario.idUsuario == null}
          ? @{/usuarios/guardar}
          : @{/usuarios/{id}/guardar(id=${usuario.idUsuario})}">

        <div th:if="${#fields.hasAnyErrors()}"
             class="alert alert-danger" role="alert">
            <ul class="mb-0">
                <li th:each="error : ${#fields.allErrors()}"
                    th:text="${error}"></li>
            </ul>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="username" class="form-label">Usuario *</label>
                <input id="username" th:field="*{username}"
                       class="form-control" maxlength="30" required>
            </div>

            <div class="col-md-6 mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input id="password" name="password" type="password"
                       class="form-control" minlength="8"
                       autocomplete="new-password"
                       th:required="${usuario.idUsuario == null}">
                <div class="form-text">
                    Mínimo 8 caracteres, máximo 72 bytes.
                    Al editar, déjala vacía para conservar la actual.
                </div>
            </div>

            <div class="col-md-6 mb-3">
                <label for="nombre" class="form-label">Nombre *</label>
                <input id="nombre" th:field="*{nombre}"
                       class="form-control" maxlength="50" required>
            </div>

            <div class="col-md-6 mb-3">
                <label for="apellidos" class="form-label">Apellidos</label>
                <input id="apellidos" th:field="*{apellidos}"
                       class="form-control" maxlength="80">
            </div>

            <div class="col-md-6 mb-3">
                <label for="nombreComercio" class="form-label">
                    Nombre del comercio
                </label>
                <input id="nombreComercio" th:field="*{nombreComercio}"
                       class="form-control" maxlength="100">
            </div>

            <div class="col-md-6 mb-3">
                <label for="correo" class="form-label">Correo</label>
                <input id="correo" th:field="*{correo}" type="email"
                       class="form-control" maxlength="75">
            </div>

            <div class="col-md-6 mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input id="telefono" th:field="*{telefono}" type="tel"
                       class="form-control" maxlength="20">
            </div>

            <div class="col-md-6 mb-3">
                <label for="direccion" class="form-label">Dirección</label>
                <input id="direccion" th:field="*{direccion}"
                       class="form-control" maxlength="255">
            </div>
        </div>

        <div class="form-check mb-3">
            <input id="activo" th:field="*{activo}" type="checkbox"
                   class="form-check-input">
            <label for="activo" class="form-check-label">
                Usuario activo
            </label>
        </div>

        <button type="submit" class="btn btn-primary">Guardar</button>
        <a th:href="@{/usuarios}" class="btn btn-secondary">Cancelar</a>
    </form>
</main>
</body>
</html>
