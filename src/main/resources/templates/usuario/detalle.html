 <!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Detalle del usuario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1>Detalle del usuario</h1>

    <dl class="row">
        <dt class="col-sm-3">Identificador</dt>
        <dd class="col-sm-9" th:text="${usuario.idUsuario}"></dd>

        <dt class="col-sm-3">Usuario</dt>
        <dd class="col-sm-9" th:text="${usuario.username}"></dd>

        <dt class="col-sm-3">Nombre</dt>
        <dd class="col-sm-9" th:text="${usuario.nombre}"></dd>

        <dt class="col-sm-3">Apellidos</dt>
        <dd class="col-sm-9" th:text="${usuario.apellidos}"></dd>

        <dt class="col-sm-3">Comercio</dt>
        <dd class="col-sm-9" th:text="${usuario.nombreComercio}"></dd>

        <dt class="col-sm-3">Correo</dt>
        <dd class="col-sm-9" th:text="${usuario.correo}"></dd>

        <dt class="col-sm-3">Teléfono</dt>
        <dd class="col-sm-9" th:text="${usuario.telefono}"></dd>

        <dt class="col-sm-3">Dirección</dt>
        <dd class="col-sm-9" th:text="${usuario.direccion}"></dd>

        <dt class="col-sm-3">Estado</dt>
        <dd class="col-sm-9"
            th:text="${usuario.activo ? 'Activo' : 'Inactivo'}"></dd>
    </dl>

    <a th:href="@{/usuarios/{id}/editar(id=${usuario.idUsuario})}"
       class="btn btn-warning">Editar</a>
    <a th:href="@{/usuarios}" class="btn btn-secondary">Volver</a>
</main>
</body>
</html>
