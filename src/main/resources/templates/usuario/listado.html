<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Usuarios</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<main class="container py-4">
    <h1>Usuarios</h1>

    <div th:if="${mensaje}" th:text="${mensaje}"
         class="alert alert-success" role="status"></div>

    <a th:href="@{/usuarios/nuevo}" class="btn btn-primary mb-3">
        Registrar usuario
    </a>
    <a th:href="@{/}" class="btn btn-outline-secondary mb-3">
        Inicio
    </a>

    <div class="table-responsive">
        <table class="table table-striped align-middle">
            <thead>
            <tr>
                <th>Usuario</th>
                <th>Nombre</th>
                <th>Correo</th>
                <th>Estado</th>
                <th>Acciones</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(usuarios)}">
                <td colspan="5">No hay usuarios registrados.</td>
            </tr>
            <tr th:each="usuario : ${usuarios}">
                <td th:text="${usuario.username}"></td>
                <td>
                    <span th:text="${usuario.nombre}"></span>
                    <span th:text="${usuario.apellidos}"></span>
                </td>
                <td th:text="${usuario.correo}"></td>
                <td th:text="${usuario.activo ? 'Activo' : 'Inactivo'}"></td>
                <td>
                    <a th:href="@{/usuarios/{id}(id=${usuario.idUsuario})}"
                       class="btn btn-info btn-sm">Ver</a>

                    <a th:href="@{/usuarios/{id}/editar(id=${usuario.idUsuario})}"
                       class="btn btn-warning btn-sm">Editar</a>

                    <form th:if="${usuario.activo}"
                          th:action="@{/usuarios/{id}/desactivar(id=${usuario.idUsuario})}"
                          method="post" class="d-inline"
                          onsubmit="return confirm('¿Deseas desactivar este usuario?');">
                        <button type="submit" class="btn btn-danger btn-sm">
                            Desactivar
                        </button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
