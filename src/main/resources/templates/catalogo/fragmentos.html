<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{general/fragmentos :: head}"/>
    <body>
        <!-- Fragmento 1: caja de búsqueda por nombre o marca (HU 12) -->
        <section th:fragment="buscar" class="container pt-4">
            <div class="row align-items-center g-2">
                <div class="col-md-6">
                    <h2 class="h3 m-0"><i class="fa-solid fa-store"></i> [[#{catalogo.titulo}]]</h2>
                </div>
                <div class="col-md-6">
                    <form th:action="@{/catalogo/buscar}" method="get" class="d-flex" role="search">
                        <input type="search" name="texto" class="form-control me-2"
                               th:value="${texto}" th:placeholder="#{catalogo.buscar.placeholder}"/>
                        <button type="submit" class="btn btn-success">
                            <i class="fa-solid fa-magnifying-glass"></i> [[#{accion.buscar}]]
                        </button>
                    </form>
                </div>
            </div>
            <p th:if="${texto != null and !texto.isBlank()}" class="text-muted mt-2 mb-0">
                [[#{catalogo.resultados}]] "<strong>[[${texto}]]</strong>"
                &middot; <a th:href="@{/catalogo}">[[#{catalogo.limpiar}]]</a>
            </p>
        </section>

        <!-- Fragmento 2: pestañas de categorías para filtrar (HU 11 y HU 12) -->
        <section th:fragment="tabs" class="container py-3">
            <ul class="nav nav-pills flex-wrap justify-content-center gap-1">
                <li class="nav-item">
                    <a th:href="@{/catalogo}" class="nav-link"
                       th:classappend="${idCategoriaActual == null} ? 'active'">
                        [[#{catalogo.todas}]]
                    </a>
                </li>
                <li th:each="c : ${categorias}" class="nav-item">
                    <a th:href="@{/catalogo/categoria/{id}(id=${c.idCategoria})}" class="nav-link"
                       th:classappend="${idCategoriaActual != null and idCategoriaActual.equals(c.idCategoria)} ? 'active'">
                        [[${c.descripcion}]]
                    </a>
                </li>
            </ul>
        </section>

        <!-- Fragmento 3: tarjetas de productos con imagen, nombre, presentación, precio y disponibilidad (HU 11) -->
        <section th:fragment="tarjetas" class="container pb-4">
            <div th:if="${productos == null or productos.empty}" class="text-center text-muted py-5">
                <i class="fa-solid fa-box-open fa-3x mb-3"></i>
                <p>[[#{catalogo.vacio}]]</p>
            </div>
            <div class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 row-cols-xl-4 g-4">
                <div th:each="p : ${productos}" class="col">
                    <div class="card h-100 shadow-sm">
                        <div class="d-flex justify-content-center align-items-center bg-light p-3" style="height: 180px;">
                            <img th:if="${p.rutaImagen != null and !p.rutaImagen.isBlank()}"
                                 th:src="${p.rutaImagen}" th:alt="${p.nombre}"
                                 class="img-fluid" style="max-height: 100%; object-fit: contain;"/>
                            <i th:unless="${p.rutaImagen != null and !p.rutaImagen.isBlank()}"
                               class="fa-solid fa-box fa-4x text-secondary"></i>
                        </div>
                        <div class="card-body d-flex flex-column">
                            <span class="badge text-bg-light border mb-2 align-self-start"
                                  th:text="${p.categoria.descripcion}">Categoría</span>
                            <h5 class="card-title mb-1" th:text="${p.nombre}">Nombre</h5>
                            <p class="card-text text-muted small mb-0">
                                <span th:text="${p.marca}">Marca</span>
                                <span th:if="${p.presentacion != null}"> &middot; [[${p.presentacion}]]</span>
                            </p>
                        </div>
                        <div class="card-footer bg-white d-flex justify-content-between align-items-center">
                            <span class="text-success h5 mb-0"
                                  th:text="'₡' + ${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">₡0.00</span>
                            <span th:if="${p.existencias > 0}" class="badge text-bg-success">
                                [[#{catalogo.disponible}]]</span>
                            <span th:unless="${p.existencias > 0}" class="badge text-bg-danger">
                                [[#{catalogo.agotado}]]</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </body>
</html>
