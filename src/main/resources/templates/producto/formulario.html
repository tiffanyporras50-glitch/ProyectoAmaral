
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Formulario - Distribuidora Amaral</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Estilos personalizados -->
    <link rel="stylesheet" th:href="@{/css/estilos.css}">
</head>

<body class="bg-light">

    <!-- BARRA DE NAVEGACIÓN -->
    <nav class="navbar navbar-dark bg-primary shadow-sm">
        <div class="container">

            <a class="navbar-brand fw-bold"
               th:href="@{/producto/listado}">
                Distribuidora Amaral
            </a>

            <a th:href="@{/producto/listado}"
               class="btn btn-outline-light btn-sm">
                Volver a productos
            </a>

        </div>
    </nav>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-10">

                <div class="card shadow-sm">

                    <!-- ENCABEZADO -->
                    <div class="card-header bg-primary text-white py-3">

                        <h4 class="mb-0 fw-bold"
                            th:text="${titulo}">
                            Registrar producto
                        </h4>

                    </div>

                    <div class="card-body p-4">

                        <p class="text-muted mb-4">
                            Complete la información correspondiente
                            al producto de Distribuidora Amaral.
                        </p>

                        <!-- FORMULARIO -->
                        <form th:action="@{/producto/guardar}"
                              th:object="${producto}"
                              method="post">

                            <!-- ID OCULTO PARA EDITAR -->
                            <input type="hidden"
                                   th:field="*{idProducto}">

                            <div class="row">

                                <!-- NOMBRE -->
                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-semibold">
                                        Nombre del producto
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{nombre}"
                                           maxlength="100"
                                           placeholder="Ej: Crema dental 100 ml"
                                           required>

                                </div>

                                <!-- MARCA -->
                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-semibold">
                                        Marca
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{marca}"
                                           maxlength="50"
                                           placeholder="Ej: Colgate">

                                </div>

                                <!-- CATEGORÍA -->
                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-semibold">
                                        Categoría
                                    </label>

                                    <select class="form-select"
                                            name="categoria.idCategoria"
                                            required>

                                        <option value="">
                                            Seleccione una categoría
                                        </option>

                                        <option th:each="categoria : ${categorias}"
                                                th:value="${categoria.idCategoria}"
                                                th:text="${categoria.descripcion}"
                                                th:selected="${producto.categoria != null and producto.categoria.idCategoria == categoria.idCategoria}">
                                        </option>

                                    </select>

                                </div>

                                <!-- PRESENTACIÓN -->
                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-semibold">
                                        Presentación
                                    </label>

                                    <input type="text"
                                           class="form-control"
                                           th:field="*{presentacion}"
                                           maxlength="50"
                                           placeholder="Ej: Caja de 12 unidades">

                                </div>

                                <!-- PRECIO -->
                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-semibold">
                                        Precio (₡)
                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           th:field="*{precio}"
                                           min="0"
                                           step="0.01"
                                           placeholder="Ej: 3500"
                                           required>

                                </div>

                                <!-- EXISTENCIAS -->
                                <div class="col-md-6 mb-3">

                                    <label class="form-label fw-semibold">
                                        Existencias disponibles
                                    </label>

                                    <input type="number"
                                           class="form-control"
                                           th:field="*{existencias}"
                                           min="0"
                                           step="1"
                                           required>

                                </div>

                                <!-- IMAGEN -->
                                <div class="col-12 mb-3">

                                    <label class="form-label fw-semibold">
                                        URL de imagen
                                    </label>

                                    <input type="url"
                                           class="form-control"
                                           th:field="*{rutaImagen}"
                                           maxlength="1024"
                                           placeholder="https://ejemplo.com/imagen.jpg">

                                </div>

                                <!-- ESTADO -->
                                <div class="col-12 mb-4">

                                    <div class="form-check">

                                        <input type="checkbox"
                                               class="form-check-input"
                                               th:field="*{activo}">

                                        <label class="form-check-label fw-semibold">
                                            Producto activo
                                        </label>

                                    </div>

                                </div>

                            </div>

                            <!-- BOTONES -->
                            <div class="d-flex gap-2 flex-wrap">

                                <button type="submit"
                                        class="btn btn-success fw-semibold">
                                    Guardar producto
                                </button>

                                <a th:href="@{/producto/listado}"
                                   class="btn btn-secondary">
                                    Cancelar
                                </a>

                            </div>

                        </form>

                    </div>

                    <!-- PIE DE TARJETA -->
                    <div class="card-footer text-center text-muted">
                        Distribuidora Amaral - Administración
                    </div>

                </div>

            </div>

        </div>

    </main>

   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
