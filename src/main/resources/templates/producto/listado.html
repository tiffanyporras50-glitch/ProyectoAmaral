
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Productos - Distribuidora Amaral</title>

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
              rel="stylesheet">
    </head>
    <body class="bg-light">

        <nav class="navbar navbar-dark bg-primary">
            <div class="container">
                <a class="navbar-brand" th:href="@{/producto/listado}">
                    Distribuidora Amaral
                </a>
            </div>
        </nav>

        <div class="container mt-5">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h2>Administración de productos</h2>

                <a th:href="@{/producto/nuevo}" class="btn btn-success">
                    + Registrar producto
                </a>
            </div>

            <div class="card shadow-sm">
                <div class="card-body">
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">

                            <thead class="table-dark">
                                <tr>
                                    <th>ID</th>
                                    <th>Producto</th>
                                    <th>Marca</th>
                                    <th>Categoría</th>
                                    <th>Precio</th>
                                    <th>Existencias</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>

                            <tbody>
                                <tr th:each="producto : ${productos}">
                                    <td th:text="${producto.idProducto}"></td>
                                    <td th:text="${producto.nombre}"></td>
                                    <td th:text="${producto.marca}"></td>
                                    <td th:text="${producto.categoria.descripcion}"></td>
                                    <td th:text="${producto.precio}"></td>
                                    <td th:text="${producto.existencias}"></td>

                                    <td>
                                        <a class="btn btn-warning btn-sm"
                                           th:href="@{/producto/modificar/{id}(id=${producto.idProducto})}">
                                            Editar
                                        </a>

                                        <form th:action="@{/producto/eliminar/{id}(id=${producto.idProducto})}"
                                              method="post" class="d-inline">

                                            <button type="submit"
                                                    class="btn btn-danger btn-sm"
                                                    onclick="return confirm('¿Eliminar este producto?');">
                                                Eliminar
                                            </button>
                                        </form>
                                    </td>
                                </tr>

                                <tr th:if="${#lists.isEmpty(productos)}">
                                    <td colspan="7" class="text-center">
                                        No hay productos registrados.
                                    </td>
                                </tr>
                            </tbody>

                        </table>
                    </div>
                </div>
            </div>

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    </body>
</html>
<link rel="stylesheet" th:href="@{/css/estilos.css}">
