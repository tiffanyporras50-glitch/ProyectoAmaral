spring.application.name=DistribuidoraAmaral

# Puerto de la aplicación
server.port=80

# Conexión a la base de datos MySQL (usuario propio del proyecto, NO el de la Tienda)
spring.datasource.url=jdbc:mysql://localhost:3306/amaral?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Costa_Rica
spring.datasource.username=usuario_amaral
spring.datasource.password=Amaral_Clave.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate: las tablas se crean con el script docs/amaral.sql
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# Thymeleaf sin caché para ver los cambios al guardar
spring.thymeleaf.cache=false
